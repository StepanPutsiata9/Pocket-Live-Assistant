openapi: 3.0.0
info:
  title: Pocket Life Assistant API
  version: 1.0.0
  description: API documentation for the full-stack React Native application.
servers:
  - url: http://localhost:3000/api
    description: Local Development Server
  - url: https://api.pocketlife.com/api
    description: Production Server (Placeholder)

# ---------------------------------------------------------
# PATHS (Endpoints)
# ---------------------------------------------------------
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: 'Alex React'
                email:
                  type: string
                  format: email
                  example: 'alex@example.com'
                password:
                  type: string
                  format: password
                  example: 'securepassword123'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      summary: Authenticate user and return JWT
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'alex@example.com'
                password:
                  type: string
                  format: password
                  example: 'securepassword123'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /recipes:
    get:
      summary: Get a list of recipes
      description: Retrieve recipes with optional text search and category filtering.
      tags:
        - Recipes
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Text to search in recipe titles or ingredients
        - in: query
          name: category
          schema:
            type: string
            enum: [Breakfast, Lunch, Dinner, Snack]
          description: Filter recipes by meal category
      responses:
        '200':
          description: A JSON array of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'

# ---------------------------------------------------------
# COMPONENTS (Reusable Data Models & Security)
# ---------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: '64a7b8f9e4b0a1a2b3c4d5e6'
        name:
          type: string
          example: 'Alex React'
        email:
          type: string
          example: 'alex@example.com'

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Access Token
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        user:
          $ref: '#/components/schemas/User'

    Recipe:
      type: object
      properties:
        id:
          type: string
          example: '75b8c9f0e4b0a1a2b3c4d5e7'
        title:
          type: string
          example: 'Avocado Toast with Egg'
        category:
          type: string
          example: 'Breakfast'
        calories:
          type: integer
          example: 350
        prepTimeMinutes:
          type: integer
          example: 10
        imageUrl:
          type: string
          example: 'https://example.com/images/avocado-toast.jpg'
